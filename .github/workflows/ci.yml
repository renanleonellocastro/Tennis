name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SDK_VERSION: 9.2.0
  # Hash of the Garmin SDK license agreement accepted for CI builds.
  # Refresh with: connect-iq-sdk-manager agreement view
  AGREEMENT_HASH: CC737BBBA104D7740D5BBCF27D0F6382

jobs:
  validate:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Validate XML, string catalogs in sync and generated string table
        run: make resources-check

      - name: Lint and type check the tools
        run: make lint-tools

      - name: Tool tests at 100% coverage
        run: make test-tools

      - name: Function length gate, strict (docs/QUALITY.md)
        run: make function-length-gate

  build-and-test:
    name: Build and unit tests (Connect IQ)
    runs-on: ubuntu-latest
    # Only on events from this repository (pull requests from forks cannot
    # read secrets). The steps below are also gated on HAS_CREDS so the job
    # stays green until the maintainer adds the GARMIN_USERNAME and
    # GARMIN_PASSWORD secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      HAS_CREDS: ${{ secrets.GARMIN_USERNAME != '' && secrets.GARMIN_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Note when device builds are skipped
        if: env.HAS_CREDS != 'true'
        run: echo "::notice::The GARMIN_USERNAME and GARMIN_PASSWORD secrets are not set, so the device build and the simulator tests are skipped. Static checks already ran. Add the secrets to enable this job."

      - uses: actions/setup-java@v4
        if: env.HAS_CREDS == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Install connect-iq-sdk-manager
        if: env.HAS_CREDS == 'true'
        run: |
          curl --silent --location \
            https://raw.githubusercontent.com/lindell/connect-iq-sdk-manager-cli/master/install.sh \
            | sudo sh

      - name: Download SDK and device files
        if: env.HAS_CREDS == 'true'
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          connect-iq-sdk-manager agreement accept --agreement-hash "$AGREEMENT_HASH"
          connect-iq-sdk-manager login
          connect-iq-sdk-manager sdk set "$SDK_VERSION"
          connect-iq-sdk-manager device download --include-fonts --manifest manifest.xml
          echo "$(connect-iq-sdk-manager sdk current-path --bin)" >> "$GITHUB_PATH"

      - name: Generate signing key
        if: env.HAS_CREDS == 'true'
        run: make key

      # Every Toybox symbol the app references must exist on every target
      # device. This is the class of bug that only crashes on the watch, for
      # example a constant that one device family does not have.
      - name: Audit API usage against all target devices
        if: env.HAS_CREDS == 'true'
        run: make audit

      # The app must compile at type check level 2 (warnings on) across a
      # small MIP screen, large AMOLED screens (416 and 454 px) and two
      # rectangular screens.
      - name: Compile for representative devices
        if: env.HAS_CREDS == 'true'
        run: make build-shapes SHAPE_DEVICES="fr55 venu2 venusq2 fenix847mm venux1"

      # Best effort: the Connect IQ simulator is unreliable without a display
      # on CI runners, so this never fails the build. The unit tests are the
      # authoritative local gate (run `make test` before committing).
      - name: Unit tests on the simulator (best effort)
        if: env.HAS_CREDS == 'true'
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libgtk-3-0 libwebkit2gtk-4.1-0 libusb-1.0-0
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
          sleep 3
          BIN="$(connect-iq-sdk-manager sdk current-path --bin)"
          "$BIN/connectiq" >/tmp/sim.log 2>&1 &
          make test-build DEVICE=fr55
          for attempt in $(seq 1 4); do
            sleep 12
            "$BIN/monkeydo" bin/Tennis-tests.prg fr55 -t 2>&1 | tee /tmp/test.log || true
            grep -q "^PASSED" /tmp/test.log && break
          done
          grep -q "^PASSED" /tmp/test.log || echo "::warning::The simulator was unavailable on CI, so the unit tests were not run here."

      - name: Upload build artifact
        if: env.HAS_CREDS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tennis-fr55-prg
          path: bin/Tennis-fr55.prg
